name: ci

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run check
      - run: npm run verify:provenance
      - run: npm run build
      - run: npm run check:dist
      - run: npm run verify:gallery
      - run: npm run postbuild:check
      - run: npm run legal:check
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
